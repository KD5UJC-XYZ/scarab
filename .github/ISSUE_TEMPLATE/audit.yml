# SPDX-License-Identifier: Apache-2.0
name: Audit finding
description: A finding from an independent audit or review of main (docs/process.md, "Findings from an independent audit")
labels: [audit, status:backlog]
body:
  - type: markdown
    attributes:
      value: |
        Exploitable security problems: do not file here, see SECURITY.md. A public ticket states the missing property and what the reference does, never how to trigger it. Title: the audit ID, then a short imperative title (for example `[AUD3-22] ...`). Pick the area and priority below; triage applies them as labels and sets the milestone.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      description: The sbt module the work is in (docs/codemap.md), or build, scripts or docs; choose more than one when it spans modules.
      options:
        - area:blst-native
        - area:codec
        - area:crypto
        - area:protocol
        - area:network
        - area:plutus
        - area:ledger
        - area:consensus
        - area:storage
        - area:models-gen
        - area:models
        - area:node
        - area:fuzz
        - area:build
        - area:scripts
        - area:docs
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: The `priority:` label (docs/process.md, "Labels and milestones").
      options:
        - priority:P0
        - priority:P1
        - priority:P2
    validations:
      required: true
  - type: input
    id: boundary
    attributes:
      label: Boundary
      description: The module, symbol or interface the finding concerns (see docs/codemap.md).
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Trusted assumptions
      description: What the boundary relies on.
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Invariant
      description: The property that must hold.
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: What is wrong or missing. Mark each claim as confirmed from source, from an earlier reproduction, or a consequence still to verify.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The source symbol, and the upstream file at a registered revision (docs/data/reference-pins.json), fixture, captured block or log excerpt. No key material.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable criteria, and the change level and gates that close it (CONTRIBUTING.md, "Gates and ceremony by level of change").
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Roadmap ID
      description: The item in docs/roadmap.md this finding extends, if any.
