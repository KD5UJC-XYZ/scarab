name: Feature or roadmap item
description: Propose a feature or pick up an item from docs/roadmap.md
labels: [enhancement, status:backlog]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The `area:` label this belongs under (docs/process.md, "Labels and milestones").
      options:
        - area:block-production
        - area:byron
        - area:ecosystem
        - area:fast-start
        - area:future-eras
        - area:hygiene
        - area:leios
        - area:networking
        - area:node-to-client
        - area:ops
        - area:plutus
        - area:publication
        - area:scale
        - area:unconfirmed-rule
        - area:verification
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: The `priority:` label (docs/process.md, "Labels and milestones").
      options:
        - priority:P0
        - priority:P1
        - priority:P2
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Roadmap ID
      description: The item in docs/roadmap.md this belongs to, if any.
      placeholder: e.g. F1
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How would it be verified?
      description: Which reference, fixtures or devnet scenario shows it is right (see CONTRIBUTING.md, "Gates and ceremony by level of change").
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
