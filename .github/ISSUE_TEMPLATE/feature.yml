name: Feature or roadmap item
description: Propose a feature or pick up an item from docs/roadmap.md
labels: [enhancement, status:backlog]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      description: The sbt module the work is in (docs/codemap.md), or build, scripts or docs; choose more than one when it spans modules.
      options:
        - area:codec
        - area:crypto
        - area:protocol
        - area:network
        - area:plutus
        - area:ledger
        - area:consensus
        - area:storage
        - area:models-gen
        - area:models
        - area:node
        - area:fuzz
        - area:build
        - area:scripts
        - area:docs
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: The `priority:` label (docs/process.md, "Labels and milestones").
      options:
        - priority:P0
        - priority:P1
        - priority:P2
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Roadmap ID
      description: The item in docs/roadmap.md this belongs to, if any.
      placeholder: e.g. F1
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How would it be verified?
      description: Which reference, fixtures or devnet scenario shows it is right (see CONTRIBUTING.md, "Gates and ceremony by level of change").
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
