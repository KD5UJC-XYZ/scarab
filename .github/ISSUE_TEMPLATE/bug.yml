name: Bug or divergence report
description: Wrong behaviour, a crash, or a disagreement with the Haskell node or the chain
labels: [bug, status:backlog]
body:
  - type: markdown
    attributes:
      value: |
        Exploitable security problems: do not file here, see SECURITY.md. This is unofficial research software.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The `area:` label this belongs under (docs/process.md, "Labels and milestones").
      options:
        - area:block-production
        - area:byron
        - area:ecosystem
        - area:fast-start
        - area:future-eras
        - area:hygiene
        - area:leios
        - area:networking
        - area:node-to-client
        - area:ops
        - area:plutus
        - area:publication
        - area:scale
        - area:unconfirmed-rule
        - area:verification
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: The `priority:` label (docs/process.md, "Labels and milestones").
      options:
        - priority:P0
        - priority:P1
        - priority:P2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse HEAD`, and whether you built in the JDK image.
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network and era
      description: Preview, devnet scenario name, ...; era (Byron ... Conway).
  - type: textarea
    id: divergence
    attributes:
      label: For a ledger or consensus divergence
      description: Slot or block hash, transaction id, expected and actual result, and the source of truth (Haskell node version, Koios, db-sync, ...). A fixture or captured block is ideal.
  - type: input
    id: roadmap
    attributes:
      label: Related compatibility row or roadmap ID
      placeholder: e.g. B2, Plutus phase 2
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: The JSON log lines around the failure. Remove any key material.
      render: json
