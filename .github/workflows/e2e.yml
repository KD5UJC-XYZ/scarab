# SPDX-License-Identifier: Apache-2.0
name: E2E devnet

# The Scala node against the official Haskell cardano-node 11.1.3 in Docker: the expensive devnet
# scenarios (soak, era walk, relay, pool, KES rotation, node-to-client, restart), one job per scenario so
# they run in parallel, each on its own standard 4 vCPU / 16 GB runner. A failing scenario does not stop
# the others.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  devnet:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scenario: soak, args: 'soak --seconds 480'}
          - {scenario: e2e, args: 'e2e'}
          - {scenario: relay, args: 'relay --seconds 300'}
          - {scenario: pool, args: 'pool'}
          - {scenario: kes-rotate, args: 'kes-rotate'}
          - {scenario: ntc, args: 'ntc'}
          - {scenario: restart, args: 'restart'}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SCARAB_DATA_DIR: ${{ github.workspace }}/../scarab-data
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache sbt launcher, boot, ivy and coursier
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-e2e-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'scripts/sbtw') }}
          restore-keys: |
            sbt-e2e-${{ runner.os }}-

      - name: Build the JDK image (digest-pinned Temurin)
        run: docker build -f docker/jdk.Dockerfile -t scarab-jdk:local .

      - name: Compile the node in the JDK image
        run: |
          mkdir -p .cache/home
          docker run --rm -v "$PWD":/work -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/work/.cache/home scarab-jdk:local \
            bash scripts/sbtw node/compile node/runtimeClasspathFile

      - name: Build the reference image from the downloaded, verified official release
        run: python3 scripts/prepare_reference_image.py --download --download-dir "$RUNNER_TEMP/release" --pull-base

      - name: Prepare the run directory
        run: mkdir -p "$SCARAB_DATA_DIR" "$RUNNER_TEMP/logs"

      - name: Run the scenario
        env:
          DEVNET_NAME: scarab-ci-${{ matrix.scenario }}
          SCENARIO_ARGS: ${{ matrix.args }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # the arguments are words on purpose
          python3 scripts/devnet.py --name "$DEVNET_NAME" $SCENARIO_ARGS 2>&1 | tee "$RUNNER_TEMP/logs/${{ matrix.scenario }}.log"

      - name: Collect summaries and logs
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          cp -r "$RUNNER_TEMP/logs" "$RUNNER_TEMP/artifact/stdout"
          for dir in "$SCARAB_DATA_DIR"/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            mkdir -p "$RUNNER_TEMP/artifact/$name"
            # run summaries, comparisons and node logs; never the frozen classes or generated keys
            find "$dir" -maxdepth 2 -type f \( -name '*.json' -o -name '*.jsonl' -o -name '*.log' \) \
              -not -path '*/classes/*' -not -path '*/genesis/*' -not -path '*/keys/*' \
              -exec cp --parents {} "$RUNNER_TEMP/artifact/$name" \; 2>/dev/null || true
          done
          for name in scarab-ci-${{ matrix.scenario }}; do
            docker logs "$name-ref" > "$RUNNER_TEMP/artifact/$name-ref.docker.log" 2>&1 || true
            docker logs "$name-scala" > "$RUNNER_TEMP/artifact/$name-scala.docker.log" 2>&1 || true
          done
          du -sh "$RUNNER_TEMP/artifact"

      - name: Upload summaries and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devnet-${{ matrix.scenario }}-${{ github.run_id }}
          path: ${{ runner.temp }}/artifact
          retention-days: 14
          if-no-files-found: warn

      - name: Tear down
        if: ${{ always() }}
        run: |
          python3 scripts/devnet.py --name "scarab-ci-${{ matrix.scenario }}" down > /dev/null 2>&1 || true
          docker ps -aq | xargs -r docker rm -f > /dev/null 2>&1 || true
          rm -rf "$SCARAB_DATA_DIR"
