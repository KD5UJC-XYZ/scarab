# SPDX-License-Identifier: Apache-2.0
name: Upstream conformance sources

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pinned fixtures and manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare watched sources with upstream refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_conformance_sources.py --output "$RUNNER_TEMP/conformance-sources.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain source drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-source-freshness
          path: ${{ runner.temp }}/conformance-sources.json
          if-no-files-found: error
