# SPDX-License-Identifier: Apache-2.0
name: Fuzz gate

# The extended decoder fuzz gate of CONTRIBUTING.md ("A decoder ... also runs `fuzz 100000 1 4`"), run on a pull
# request that touches a decoder, its corpus or the fuzz project. The nightly `fuzz.yml` keeps its rotating seeds;
# this gate uses the fixed seeds 1 to 4 so that a failure on a pull request repeats with the printed command.
#
# The workflow runs on every pull request and the one job always reports, so the check name exists whether or not
# a required check is configured; a detection step decides whether the fuzz steps run. A change outside the list
# below skips them and the job succeeds in seconds.
on:
  pull_request:
    branches: [main, dev, release/alpha, release/beta, release/preprod, release/prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-gate:
    name: decoder fuzz gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The pull request's merge commit: its first parent is the current base, so the diff against it is the change.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Everything the fuzz project reads or runs: its own sources; the decoders it calls (codec, protocol with the
      # mini-protocol and mux codecs, ledger with the block, header, transaction, witness and script decoders, plutus
      # for Plutus data, crypto for hashing, node-to-client queries and the mempool messages in node); the CDDL
      # schemas and overrides it samples (models, models-gen); every committed fixture and fuzz seed (fixtures); and
      # the build, the launcher and this workflow. Deliberately broad: a decoder missed here escapes the gate.
      - name: Decide whether decoders or fuzz inputs changed
        id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          paths=(
            fuzz codec crypto protocol ledger plutus models models-gen fixtures
            node/src/main/scala/xyz/kd5ujc/scarab/node/ntc
            node/src/main/scala/xyz/kd5ujc/scarab/node/mempool
            build.sbt project scripts/sbtw scripts/prepare_scalus.py patches/scalus
            .github/workflows/fuzz-gate.yml
          )
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "dispatched by hand: running the gate"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD -- "${paths[@]}")
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "decoder or fuzz inputs changed, running the gate:"
            echo "$changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no decoder or fuzz input changed: the gate is skipped (a skipped gate is a pass)"
          fi
      - name: Set up tested JDK
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
          check-latest: false
          overwrite-settings: false
      - name: Cache sbt launcher, boot, ivy and coursier
        if: steps.detect.outputs.run == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'project/*.scala', 'scripts/sbtw', 'scripts/prepare_scalus.py', 'patches/scalus/**') }}
          restore-keys: |
            sbt-${{ runner.os }}-
      - name: Fuzz the decoders (100000 cases, seeds 1 to 4)
        if: steps.detect.outputs.run == 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          bash scripts/sbtw "fuzz 100000 1 4" 2>&1 | tee "$RUNNER_TEMP/logs/fuzz.log"
      - name: Upload the log
        if: failure() && steps.detect.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/logs
          retention-days: 30
