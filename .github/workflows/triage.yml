# SPDX-License-Identifier: Apache-2.0
name: Triage report

# The triage check of docs/process.md ("Labels and milestones") over the open issues, read-only through
# scripts/status.py --check. Its report replaces the body of the one issue titled "Triage report", created
# with its own labels and milestone on the first run, so the report never lists itself and never adds comments.
# A closed "Triage report" issue is reopened: closing it does not stop the report.
on:
  workflow_dispatch:
  schedule:
    - cron: '53 5 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RULES_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/process.md#labels-and-milestones
    steps:
      - name: Check out the check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the triage check
        run: |
          set +e
          python3 scripts/status.py --check > "$RUNNER_TEMP/triage.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/triage.txt"
          # 1 is a report with violations, which is this workflow's output; anything else is a failed check.
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Write the report into the triage issue
        run: |
          body="$RUNNER_TEMP/body.md"
          {
            echo "Written by the [triage workflow]($RUN_URL) on $(date -u +%Y-%m-%dT%H:%MZ) from \`python3 scripts/status.py --check\`, against [the rules]($RULES_URL). The next run replaces this body."
            echo
            echo '~~~text'
            head -n 800 "$RUNNER_TEMP/triage.txt"
            echo '~~~'
          } > "$body"
          number=$(gh api --paginate 'repos/{owner}/{repo}/issues?state=all&per_page=100' \
            --jq '.[] | select(.pull_request == null and .title == "Triage report") | .number' | sort -n | head -n 1)
          if [ -z "$number" ]; then
            url=$(gh issue create --title "Triage report" --body-file "$body" \
              --label area:scripts --label priority:P2 --label status:backlog --milestone reference-parity)
            gh issue pin "$url" || echo "::warning::could not pin $url"
          else
            if [ "$(gh issue view "$number" --json state --jq .state)" = "CLOSED" ]; then gh issue reopen "$number"; fi
            gh issue edit "$number" --body-file "$body"
          fi
