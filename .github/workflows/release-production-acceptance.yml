# SPDX-License-Identifier: Apache-2.0
name: Observe actual Scarab-produced preprod block
on:
  workflow_dispatch:
    inputs:
      source:
        type: string
        required: true
      tag:
        type: string
        required: true
      channel:
        type: choice
        options: [alpha, beta, preprod, prod]
        required: true
      trusted-source:
        type: string
        required: true
      candidate-run:
        type: string
        required: true
      candidate-artifact:
        type: string
        required: true
      candidate-digest:
        type: string
        required: true
      candidate-manifest:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: scarab-preprod-production-observation
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      environment: ${{ steps.policy.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          TAG: ${{ inputs.tag }}
          TRUSTED_SOURCE: ${{ inputs.trusted-source }}
          CANDIDATE_RUN: ${{ inputs.candidate-run }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate-artifact }}
          CANDIDATE_DIGEST: ${{ inputs.candidate-digest }}
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from publication_common import GitHub, canonical, load_json, require
          from publication_authority import control_plane, candidate_run
          from publication_policy import environment_snapshot
          require(os.environ['GITHUB_REF'] == 'refs/tags/' + os.environ['TAG'] and os.environ['GITHUB_SHA'] == os.environ['SOURCE'], 'exact-tag observation invocation required')
          github = GitHub(os.environ['GITHUB_REPOSITORY'], os.environ['GH_TOKEN'])
          control_plane(github, os.environ['SOURCE'], os.environ['TRUSTED_SOURCE'])
          candidate_run(github, int(os.environ['CANDIDATE_RUN']), os.environ['SOURCE'], os.environ['TAG'], int(os.environ['CANDIDATE_ARTIFACT']), os.environ['CANDIDATE_DIGEST'])
          policy = load_json('release/publication-policy.json')
          snapshot = environment_snapshot(github, 'preprod', policy)
          Path(os.environ['RUNNER_TEMP'], 'environment.json').write_bytes(canonical(snapshot) + b'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('environment=' + snapshot['environment'] + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: observer-environment
          path: ${{ runner.temp }}/environment.json
          if-no-files-found: error
  observe:
    needs: preflight
    runs-on: [self-hosted, linux, x64, scarab-preprod-observer]
    timeout-minutes: 15
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.trusted-source }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: observer-environment
          path: ${{ runner.temp }}/preflight
      - name: Repeat existing protected environment policy before touching operator processes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/publication_policy.py --repository "$GITHUB_REPOSITORY" --channel preprod
          --policy release/publication-policy.json --previous "$RUNNER_TEMP/preflight/environment.json"
          --output "$RUNNER_TEMP/approved-environment.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.candidate-artifact }}
          run-id: ${{ inputs.candidate-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Observe public existing-forger events and independent native point only
        env:
          SOURCE: ${{ inputs.source }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          MANIFEST: ${{ inputs.candidate-manifest }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from publication_common import canonical, load_json, require
          policy = load_json('release/publication-policy.json')
          observer = policy.get('observer')
          require(isinstance(observer, dict), 'owner has not configured an existing protected observer/forger/native process')
          temporary = Path(os.environ['RUNNER_TEMP'])
          (temporary / 'genesis-hashes.json').write_bytes(canonical(policy['preprodGenesisSha256']))
          command = ['python3', 'scripts/observe_produced_block.py', '--repository', os.environ['GITHUB_REPOSITORY'],
                     '--source', os.environ['SOURCE'], '--tag', os.environ['TAG'], '--channel', os.environ['CHANNEL'],
                     '--candidate-sha256', os.environ['MANIFEST'], '--candidate', str(temporary / 'candidate'),
                     '--image-repository', policy['imageRepository'], '--genesis-hashes', str(temporary / 'genesis-hashes.json'),
                     '--output', str(temporary / 'observation.json')]
          for field in ['forger', 'native', 'socket', 'header', 'since']:
              command.extend(['--' + field, observer[field]])
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-produced-block-observation
          path: ${{ runner.temp }}/observation.json
          if-no-files-found: error
  authenticate-observation:
    needs: observe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: public-produced-block-observation
          path: ${{ runner.temp }}/observation
      - name: Attest canonical protected-runner observation without claiming runner independence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/observation/observation.json
          predicate-type: https://scarab.kd5ujc.xyz/attestations/produced-block/v1
          predicate-path: ${{ runner.temp }}/observation/observation.json
