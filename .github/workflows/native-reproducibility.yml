# SPDX-License-Identifier: Apache-2.0
name: Native library reproducibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-reproducibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-blst:
    name: portable Linux amd64 native byte comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine whether native inputs changed
        id: native-inputs
        run: python3 scripts/native_rebuild_required.py
      - name: Two uncached builds must match the committed library
        if: steps.native-inputs.outputs.rebuild == 'true'
        run: python3 scripts/check_native_reproducibility.py --output "$RUNNER_TEMP/scarab-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain input identities, actual results and failure diagnostics
        if: always() && steps.native-inputs.outputs.rebuild == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-reproducibility-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/scarab-native-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            ${{ runner.temp }}/scarab-native-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/scarab-native-${{ github.run_id }}-${{ github.run_attempt }}/mismatch-*.json
            ${{ runner.temp }}/scarab-native-${{ github.run_id }}-${{ github.run_attempt }}/build-*/packages.tsv
            ${{ runner.temp }}/scarab-native-${{ github.run_id }}-${{ github.run_attempt }}/build-*/downloaded-debs.sha256
            ${{ runner.temp }}/scarab-native-${{ github.run_id }}-${{ github.run_attempt }}/build-*/apt/**
            ${{ runner.temp }}/scarab-native-${{ github.run_id }}-${{ github.run_attempt }}/build-*/elf.txt
            ${{ runner.temp }}/scarab-native-${{ github.run_id }}-${{ github.run_attempt }}/build-*/exports.txt
            ${{ runner.temp }}/scarab-native-${{ github.run_id }}-${{ github.run_attempt }}/build-*/symbols.txt
            ${{ runner.temp }}/scarab-native-${{ github.run_id }}-${{ github.run_attempt }}/build-*/disassembly.txt
