# SPDX-License-Identifier: Apache-2.0
name: Release PR preparation (no publication)

on:
  pull_request:
    branches: [main, dev, release/alpha, release/beta, release/preprod, release/prod]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Exact reviewed integration source commit (40 lowercase hex)
        required: true
        type: string
      channel:
        description: Proposal maturity channel (not a Cardano network)
        required: true
        type: choice
        options: [alpha, beta, preprod, prod]
      date:
        description: Explicit ISO proposal date YYYY-MM-DD
        required: true
        type: string
      ordinal:
        description: Canonical prerelease ordinal (ignored for production)
        default: '0'
        type: string
      expected_pr_head:
        description: Exact existing preparation PR head; empty only for first creation
        type: string
      maintenance:
        description: Explicitly review a maintenance-only version proposal
        default: false
        type: boolean
      next_version:
        description: Optional reviewed recovery version; cannot lower automatic proposal
        type: string
      override_reason:
        description: Required rationale for next_version override
        type: string
      write:
        description: Open/update PR using the protected GitHub App (never publish)
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-pr-preparation
  cancel-in-progress: false

env:
  SCARAB_PROMOTION_POLICY: ${{ vars.SCARAB_PROMOTION_POLICY || 'transition' }}

jobs:
  controls:
    name: release proposal controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Install pinned tools
        run: |
          npm ci --prefix scripts/release-please --ignore-scripts
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install --require-hashes -r scripts/release/requirements.txt
      - name: Verify proposal branch rule, authority file and same-cut receipt
        if: github.event_name == 'pull_request'
        env:
          PROPOSAL_HEAD: ${{ github.event.pull_request.head.sha }}
          PROPOSAL_BASE: ${{ github.event.pull_request.base.sha }}
          PROPOSAL_BRANCH: ${{ github.head_ref }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          args=()
          if [ "$SAME_REPOSITORY" = true ]; then args+=(--same-repo); fi
          "$RUNNER_TEMP/release-python/bin/python" scripts/release_proposal.py --repo "$PWD" --cut "$PROPOSAL_HEAD" \
            --branch="$PROPOSAL_BRANCH" --base "$PROPOSAL_BASE" "${args[@]}"
      - name: Actual release-please lifecycle and Git lease controls
        env:
          SCARAB_RELEASE_PYTHON: ${{ runner.temp }}/release-python/bin/python
        run: npm test --prefix scripts/release-please

  preview:
    if: github.event_name == 'workflow_dispatch' && !inputs.write && github.ref == 'refs/heads/main' && github.repository == 'KD5UJC-XYZ/scarab'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: controls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Install pinned tools
        run: |
          npm ci --prefix scripts/release-please --ignore-scripts
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install --require-hashes -r scripts/release/requirements.txt
          python3 scripts/install_publication_tools.py --output "$RUNNER_TEMP/release-tools"
      - name: Prepare local preview only
        env:
          SOURCE: ${{ inputs.source }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_DATE: ${{ inputs.date }}
          ORDINAL: ${{ inputs.ordinal }}
          EXPECTED_HEAD: ${{ inputs.expected_pr_head }}
          MAINTENANCE: ${{ inputs.maintenance }}
          NEXT_VERSION: ${{ inputs.next_version }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-please/invoke.sh preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-proposal-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/release-proposal/
          if-no-files-found: warn

  environment-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.write && github.ref == 'refs/heads/main' && github.repository == 'KD5UJC-XYZ/scarab'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.policy.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: GET existing protected App environment before referencing it
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publication_policy.py --repository KD5UJC-XYZ/scarab \
            --environment scarab-release-pr --expected-ref refs/heads/main \
            --policy release-please-environment-policy.json --output "$RUNNER_TEMP/release-pr-environment.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pr-environment-${{ github.run_id }}
          path: ${{ runner.temp }}/release-pr-environment.json

  prepare-pr:
    needs: environment-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ needs.environment-preflight.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pr-environment-${{ github.run_id }}
          path: ${{ runner.temp }}/environment-before
      - name: Recheck approved environment before obtaining the App key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publication_policy.py --repository KD5UJC-XYZ/scarab \
            --environment scarab-release-pr --expected-ref refs/heads/main \
            --policy release-please-environment-policy.json --previous "$RUNNER_TEMP/environment-before/release-pr-environment.json" \
            --output "$RUNNER_TEMP/release-pr-environment-after.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Install pinned tools before exposing the App token
        run: |
          npm ci --prefix scripts/release-please --ignore-scripts
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install --require-hashes -r scripts/release/requirements.txt
          python3 scripts/install_publication_tools.py --output "$RUNNER_TEMP/release-tools"
      - name: Validate frozen source and baseline before requesting the App token
        env:
          SOURCE: ${{ inputs.source }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_DATE: ${{ inputs.date }}
          ORDINAL: ${{ inputs.ordinal }}
          EXPECTED_HEAD: ${{ inputs.expected_pr_head }}
          MAINTENANCE: ${{ inputs.maintenance }}
          NEXT_VERSION: ${{ inputs.next_version }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-please/invoke.sh validate
      - name: Require protected GitHub App credentials
        env:
          APP_CLIENT_ID: ${{ vars.SCARAB_RELEASE_PR_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.SCARAB_RELEASE_PR_APP_PRIVATE_KEY }}
        run: test -n "$APP_CLIENT_ID" && test -n "$APP_KEY"
      - name: Mint repository-scoped App installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCARAB_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCARAB_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: KD5UJC-XYZ
          repositories: scarab
          permission-contents: write
          permission-pull-requests: write
      - name: One release-please PR create/update path; no publisher
        env:
          SOURCE: ${{ inputs.source }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_DATE: ${{ inputs.date }}
          ORDINAL: ${{ inputs.ordinal }}
          EXPECTED_HEAD: ${{ inputs.expected_pr_head }}
          MAINTENANCE: ${{ inputs.maintenance }}
          NEXT_VERSION: ${{ inputs.next_version }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_TOKEN: ${{ steps.app.outputs.token }}
        run: bash scripts/release-please/invoke.sh write
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-proposal-pr-${{ github.run_id }}
          path: ${{ runner.temp }}/release-proposal/
          if-no-files-found: warn
