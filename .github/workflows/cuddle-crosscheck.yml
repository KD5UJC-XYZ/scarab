# SPDX-License-Identifier: Apache-2.0
name: CDDL cross-check (cuddle)

# The generated CDDL codecs against cuddle, upstream's independent CDDL tool (docs/models.md, section 13):
# cuddle-generated terms must decode with the generated codecs, our sampler's terms must validate in cuddle,
# and both tools must read the same rules from the vendored files. Runs on every pull request, every push to main
# and nightly; documentation-only changes skip the comparison steps. The check reports on every pull request,
# and a push to main runs nothing its pull request did not (scripts/check_ci_parity.py).
on:
  pull_request:
    branches: [main, dev, release/alpha, release/beta, release/preprod, release/prod]
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every other run has a group of its own (ci.yml).
concurrency:
  group: cuddle-crosscheck-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the complete change
        id: classify
        run: python3 scripts/ci_changes.py

  crosscheck:
    name: cuddle 1.8.1.0 against the generated codecs
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      IMAGE: scarab-cuddle:1.8.1.0
    steps:
      - name: Require successful change classification
        env:
          CLASSIFY_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run }}
        run: |
          test "$CLASSIFY_RESULT" = success
          case "$RUN_CHECKS" in true) ;; false) echo 'Documentation-only: expensive checks not required' ;; *) exit 1 ;; esac
      - name: Check out source
        if: needs.changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tested JDK
        if: needs.changes.outputs.run == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
          check-latest: false
          overwrite-settings: false
      - name: Cache sbt launcher, boot, ivy and coursier
        if: needs.changes.outputs.run == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'project/*.scala', 'scripts/sbtw', 'scripts/prepare_scalus.py', 'patches/scalus/**') }}
          restore-keys: |
            sbt-${{ runner.os }}-
      # Building cuddle takes about 15 minutes of GHC; the image only changes with the Dockerfile.
      - name: Cache the cuddle image
        if: needs.changes.outputs.run == 'true'
        id: image-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/cuddle-image.tar
          key: cuddle-image-${{ hashFiles('docker/cuddle.Dockerfile') }}
      - name: Load the cached image
        if: needs.changes.outputs.run == 'true' && (steps.image-cache.outputs.cache-hit == 'true')
        run: docker load --input "$RUNNER_TEMP/cuddle-image.tar"
      - name: Build the cuddle image (pinned GHC, pinned Hackage index)
        if: needs.changes.outputs.run == 'true' && (steps.image-cache.outputs.cache-hit != 'true')
        run: |
          docker build -f docker/cuddle.Dockerfile -t "$IMAGE" docker
          docker save --output "$RUNNER_TEMP/cuddle-image.tar" "$IMAGE"
      - name: Cross-check
        if: needs.changes.outputs.run == 'true'
        run: python3 scripts/cddl_crosscheck.py run --count 40 --image "$IMAGE" --jobs 4
      - name: Keep the report and the first failing terms
        if: needs.changes.outputs.run == 'true' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuddle-crosscheck
          path: |
            target/crosscheck/report.json
            target/crosscheck/decode.tsv
            target/crosscheck/results.json
          if-no-files-found: ignore
          retention-days: 14

  # The name the cutover's required checks list (scripts/promotion_rules.py); it fails unless the comparison passed.

  gate:
    name: CDDL comparison gate
    if: always()
    needs: [crosscheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COMPARISON_RESULT: ${{ needs.crosscheck.result }}
    steps:
      - name: Require a successful comparison
        run: test "$COMPARISON_RESULT" = success
