# SPDX-License-Identifier: Apache-2.0
name: CDDL cross-check (cuddle)

# The generated CDDL codecs against cuddle, upstream's independent CDDL tool (docs/models.md, section 13):
# cuddle-generated terms must decode with the generated codecs, our sampler's terms must validate in cuddle,
# and both tools must read the same rules from the vendored files. Runs on every change to the vendored CDDL,
# the generator or the cross-check itself, and nightly (a new cuddle behaviour cannot arrive unnoticed because
# the image is pinned, but the sampler seeds and the sbt dependencies move).
on:
  pull_request:
    branches: [main, dev, release/alpha, release/beta, release/preprod, release/prod]
  push:
    branches: [main]
    paths:
      - 'models/src/main/cddl/**'
      - 'models/src/main/scala/**'
      - 'models/src/test/scala/**/CuddleCrossCheck.scala'
      - 'models/cuddle-allowlist.tsv'
      - 'models-gen/**'
      - 'codec/src/main/scala/**'
      - 'scripts/cddl_crosscheck.py'
      - 'docker/cuddle.Dockerfile'
      - 'build.sbt'
      - 'project/**'
      - '.github/workflows/cuddle-crosscheck.yml'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuddle-crosscheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select CDDL changes without suppressing the required check
        id: detect
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths=(
            models/src/main/cddl models/src/main/scala
            'models/src/test/scala/**/CuddleCrossCheck.scala' models/cuddle-allowlist.tsv
            models-gen codec/src/main/scala scripts/cddl_crosscheck.py
            docker/cuddle.Dockerfile build.sbt project scripts/sbtw scripts/prepare_scalus.py patches/scalus
            .github/workflows/cuddle-crosscheck.yml
          )
          if git diff --quiet HEAD^1 HEAD -- "${paths[@]}"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            comparison_status=$?
            test "$comparison_status" = 1
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  crosscheck:
    name: cuddle 1.8.1.0 against the generated codecs
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      IMAGE: scarab-cuddle:1.8.1.0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tested JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
          check-latest: false
          overwrite-settings: false
      - name: Cache sbt launcher, boot, ivy and coursier
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'project/*.scala', 'scripts/sbtw', 'scripts/prepare_scalus.py', 'patches/scalus/**') }}
          restore-keys: |
            sbt-${{ runner.os }}-
      # Building cuddle takes about 15 minutes of GHC; the image only changes with the Dockerfile.
      - name: Cache the cuddle image
        id: image-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/cuddle-image.tar
          key: cuddle-image-${{ hashFiles('docker/cuddle.Dockerfile') }}
      - name: Load the cached image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/cuddle-image.tar"
      - name: Build the cuddle image (pinned GHC, pinned Hackage index)
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          docker build -f docker/cuddle.Dockerfile -t "$IMAGE" docker
          docker save --output "$RUNNER_TEMP/cuddle-image.tar" "$IMAGE"
      - name: Cross-check
        run: python3 scripts/cddl_crosscheck.py run --count 40 --image "$IMAGE" --jobs 4
      - name: Keep the report and the first failing terms
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuddle-crosscheck
          path: |
            target/crosscheck/report.json
            target/crosscheck/decode.tsv
            target/crosscheck/results.json
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: CDDL comparison gate
    if: always()
    needs: [changes, crosscheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DETECTION_RESULT: ${{ needs.changes.result }}
      COMPARISON_REQUIRED: ${{ needs.changes.outputs.run }}
      COMPARISON_RESULT: ${{ needs.crosscheck.result }}
    steps:
      - name: Require successful selection and its requested comparison
        run: |
          test "$DETECTION_RESULT" = success
          if [ "$COMPARISON_REQUIRED" = true ]; then
            test "$COMPARISON_RESULT" = success
          else
            test "$COMPARISON_REQUIRED" = false
            test "$COMPARISON_RESULT" = skipped
          fi
