# SPDX-License-Identifier: Apache-2.0
name: Secret-path timing

# The timing test of the secret paths of VRF proving and KES signing (SecretPathTiming, tools), nightly and on demand:
# scripts/secret_timing.py builds the tools in the JDK image, runs the test several times, each in a fresh container
# and JVM, and decides. A leak is one secret target above dudect's threshold in two conclusive runs and fails the job;
# a run whose own controls fail is inconclusive, and too few conclusive runs leave the job green with a warning, which
# is neither a pass nor a failure. The job summary has every statistic, the runner's CPU and the verdict; the reports
# and logs are kept as a workflow artifact and published nowhere (docs/running/secret-timing.md).
# A dispatched run has a concurrency group of its own, so that several can run at once, each on a runner of its own.
on:
  schedule:
    - cron: '31 4 * * *'
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Runs of the test in the job, each in a JVM of its own (2 to 10)'
        required: false
        default: '3'
      measurements:
        description: 'Measurements a multiplication (a quarter as many a proof, output, signature or evolution)'
        required: false
        default: '100000'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'schedule' && 'secret-timing-nightly' || format('secret-timing-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  timing:
    name: time the secret paths
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache sbt launcher, boot, ivy and coursier
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-timing-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'project/*.scala', 'scripts/sbtw') }}
          restore-keys: |
            sbt-timing-${{ runner.os }}-
            sbt-conformance-${{ runner.os }}-
            sbt-${{ runner.os }}-

      # The program's exit status is the verdict: 0 no leak found, 1 a leak confirmed, 2 inconclusive, 3 the check
      # could not run. This step keeps it for the last one, so that the summary and the artifact come first.
      - name: Build the tools and run the test
        id: measure
        env:
          REPETITIONS: ${{ inputs.repetitions || '3' }}
          MEASUREMENTS: ${{ inputs.measurements || '100000' }}
        run: |
          mkdir -p .cache
          set +e
          python3 -I -B scripts/secret_timing.py --out "$RUNNER_TEMP/secret-timing" \
            --repetitions "$REPETITIONS" --measurements "$MEASUREMENTS" --run-timeout 1500 \
            --image scarab-jdk:local --build-image --owner "secret-timing-$GITHUB_RUN_ID"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/secret-timing/summary.md" ]; then
            cat "$RUNNER_TEMP/secret-timing/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Secret-path timing: the check could not run (no summary; see the log of the step before)' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the reports, the summary, the provenance and the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/secret-timing/run-*.json
            ${{ runner.temp }}/secret-timing/run-*.log
            ${{ runner.temp }}/secret-timing/summary.json
            ${{ runner.temp }}/secret-timing/summary.md
            ${{ runner.temp }}/secret-timing/provenance.json
            ${{ runner.temp }}/secret-timing/build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Verdict
        if: ${{ always() }}
        env:
          STATUS: ${{ steps.measure.outputs.status }}
        run: |
          case "$STATUS" in
            0) echo 'no leak found' ;;
            1) echo '::error title=Secret-path timing: leak confirmed::a secret target was above the threshold in two conclusive runs; see the job summary and docs/running/secret-timing.md'
               exit 1 ;;
            2) echo '::warning title=Secret-path timing: inconclusive::too few runs had controls that read as they must; this is neither a pass nor a failure (docs/running/secret-timing.md)' ;;
            *) echo "::error title=Secret-path timing: the check could not run::exit status '${STATUS}'; see the log of the step that ran the test"
               exit 1 ;;
          esac
