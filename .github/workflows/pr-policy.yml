# SPDX-License-Identifier: Apache-2.0
name: PR policy

# Evaluate metadata using trusted default-branch code. No PR checkout, cache, secret or build; the only network use is
# a read of the pull request's changed paths (both sides of a rename), for the level and review floors of
# scripts/pr_policy.py, and of its comments, reviews and merge base, for the review the body links. Comment bodies are data: they
# reach the script as JSON in a file, never through the shell.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: PR title and promotion source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | {id, body, user: {id: .user.id, type: .user.type}}' > "$RUNNER_TEMP/comments.jsonl"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | {id, state, commit_id, user: {id: .user.id, type: .user.type}}' > "$RUNNER_TEMP/reviews.jsonl"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq .merge_base_commit.sha \
            > "$RUNNER_TEMP/merge-base.txt"
      - name: Validate event metadata
        env:
          SCARAB_PROMOTION_POLICY: ${{ vars.SCARAB_PROMOTION_POLICY }}
        run: |
          python3 scripts/pr_policy.py --files "$RUNNER_TEMP/files.txt" --comments "$RUNNER_TEMP/comments.jsonl" \
            --reviews "$RUNNER_TEMP/reviews.jsonl" --merge-base "$RUNNER_TEMP/merge-base.txt"
