# SPDX-License-Identifier: Apache-2.0
name: PR policy

# Evaluate metadata using trusted default-branch code. No PR checkout, cache, secret or build; the only network use is
# a read of the pull request's changed paths, for the path checks of scripts/pr_policy.py: the merge base from the
# compare API, and the head and merge-base commits and trees (no file content) fetched into a bare repository outside
# the checkout, whose names `git diff` lists; nothing of the pull request is checked out or run.
# When the pull request changes the storage format guard, its version of the guard is read as data, with the
# states of the pull requests its one-off exceptions name (FMT-1).
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: PR title and promotion source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The changed paths are read from git at the event's own commits, never from the live pull request: the merge
      # base of the event's base and head SHAs (compare API) and the head, fetched with depth 1 and no blobs (commits
      # and trees only) into a bare repository in RUNNER_TEMP, and `git diff --name-only --no-renames -z` between them,
      # which names both sides of a rename and keeps each path whole, NUL-delimited, into scripts/pr_policy.py.
      # Nothing of the pull request is checked out or run, and a read that fails fails the job.
      - name: Read the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          base=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          repo="$RUNNER_TEMP/changed-paths.git"
          git init -q --bare "$repo"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git -C "$repo" fetch -q --no-tags --depth=1 \
            --filter=blob:none "https://github.com/${GITHUB_REPOSITORY}.git" "$HEAD_SHA" "$base"
          git -C "$repo" diff --name-only --no-renames -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/files.nul"
      # The pull request's guard is fetched as a file and read with `ast` by the trusted policy, never run, when it is
      # among the changed paths (files.nul, NUL-delimited, from the step before). A read that fails leaves no file, or
      # no state: the validation step refuses what it cannot read.
      - name: Read the one-off exceptions of the pull request's guard
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          : > "$RUNNER_TEMP/one-off-states.jsonl"
          : > "$RUNNER_TEMP/one-off-keys.txt"
          if grep -qzxF scripts/check_storage_format.py "$RUNNER_TEMP/files.nul"; then
            gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/scripts/check_storage_format.py?ref=${HEAD_SHA}" \
              > "$RUNNER_TEMP/head-guard.py" || rm -f "$RUNNER_TEMP/head-guard.py"
            if [ -f "$RUNNER_TEMP/head-guard.py" ]; then
              python3 scripts/pr_policy.py --print-one-off-keys "$RUNNER_TEMP/head-guard.py" \
                > "$RUNNER_TEMP/one-off-keys.txt" || : > "$RUNNER_TEMP/one-off-keys.txt"
            fi
            while read -r number; do
              if state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '{number, state, merged}'); then
                printf '%s\n' "$state" >> "$RUNNER_TEMP/one-off-states.jsonl"
              fi
            done < "$RUNNER_TEMP/one-off-keys.txt"
          fi
      - name: Validate event metadata
        env:
          SCARAB_PROMOTION_POLICY: ${{ vars.SCARAB_PROMOTION_POLICY }}
        run: |
          python3 scripts/pr_policy.py --files-nul "$RUNNER_TEMP/files.nul" --head-guard "$RUNNER_TEMP/head-guard.py" \
            --one-off-states "$RUNNER_TEMP/one-off-states.jsonl"
