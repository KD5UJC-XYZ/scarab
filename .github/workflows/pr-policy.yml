# SPDX-License-Identifier: Apache-2.0
name: PR policy

# Evaluate metadata using trusted default-branch code. No PR checkout, cache, secret or build; the only network use is
# a read of the pull request's changed paths, for the level floors of scripts/pr_policy.py.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: PR title and promotion source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' \
            > "$RUNNER_TEMP/files.txt"
      - name: Validate event metadata
        env:
          SCARAB_PROMOTION_POLICY: ${{ vars.SCARAB_PROMOTION_POLICY }}
        run: python3 scripts/pr_policy.py --files "$RUNNER_TEMP/files.txt"
