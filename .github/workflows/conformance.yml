# SPDX-License-Identifier: Apache-2.0
name: Conformance reports

# Scarab's reports for pragma-org's node-diversity-conformance site, on demand only
# (docs/running/conformance.md): scripts/conformance/run.py builds the tools in the JDK image, runs each
# chosen scenario on its pinned inputs and checks the report; the files are kept as a workflow artifact.
# With `publish`, from main only, scripts/conformance/publish.py commits them to the public reports repository
# KD5UJC-XYZ/scarab-conformance, pushing with the deploy key in the CONFORMANCE_REPO_DEPLOY_KEY secret.
# uplc-turbo is a timing benchmark and is not offered: it runs ad hoc on a quiet machine.
on:
  workflow_dispatch:
    inputs:
      ledger-rules:
        description: 'ledger-rules'
        type: boolean
        default: true
      uplc-conformance:
        description: 'uplc-conformance (Scarab''s own evaluator)'
        type: boolean
        default: true
      cbor-decoding:
        description: 'cbor-decoding, both eras (skipped while its tool is absent)'
        type: boolean
        default: true
      publish:
        description: 'Publish the reports to KD5UJC-XYZ/scarab-conformance (main only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: conformance-reports
  cancel-in-progress: false

jobs:
  reports:
    name: write and check the reports
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache sbt launcher, boot, ivy and coursier
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-conformance-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'project/*.scala', 'scripts/sbtw', 'scripts/prepare_scalus.py', 'patches/scalus/**') }}
          restore-keys: |
            sbt-conformance-${{ runner.os }}-
            sbt-${{ runner.os }}-

      - name: Write and check the reports
        env:
          LEDGER_RULES: ${{ inputs.ledger-rules }}
          UPLC_CONFORMANCE: ${{ inputs.uplc-conformance }}
          CBOR_DECODING: ${{ inputs.cbor-decoding }}
        run: |
          scenarios=()
          if [ "$LEDGER_RULES" = true ]; then scenarios+=(ledger-rules); fi
          if [ "$UPLC_CONFORMANCE" = true ]; then scenarios+=(uplc-conformance); fi
          if [ "$CBOR_DECODING" = true ]; then scenarios+=(cbor-decoding); fi
          if [ "${#scenarios[@]}" -eq 0 ]; then echo "no scenario chosen"; exit 1; fi
          mkdir -p .cache
          python3 -I -B scripts/conformance/run.py "${scenarios[@]}" \
            --out "$RUNNER_TEMP/conformance" --inputs "$RUNNER_TEMP/conformance-inputs" \
            --image scarab-jdk:local --build-image --owner "conformance-$GITHUB_RUN_ID"

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/conformance/summary.json" ]; then
            { echo '```json'; cat "$RUNNER_TEMP/conformance/summary.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the reports, their provenance and the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/conformance/*.json.gz
            ${{ runner.temp }}/conformance/*.provenance.json
            ${{ runner.temp }}/conformance/summary.json
            ${{ runner.temp }}/conformance/work/**/*.log
          retention-days: 30
          if-no-files-found: error

  publish:
    name: publish to the reports repository
    needs: reports
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The push goes through the reports repository's deploy key, not this repository's token, which stays read-only.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Publish from main only, with the deploy key
        env:
          HAS_DEPLOY_KEY: ${{ secrets.CONFORMANCE_REPO_DEPLOY_KEY != '' }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::reports are published from main only, not $GITHUB_REF"
            exit 1
          fi
          if [ "$HAS_DEPLOY_KEY" != true ]; then
            echo "::error::the secret CONFORMANCE_REPO_DEPLOY_KEY is not set: add the private half of a deploy key with write access to KD5UJC-XYZ/scarab-conformance (docs/running/conformance.md)"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the reports repository with its deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KD5UJC-XYZ/scarab-conformance
          ref: main
          path: scarab-conformance
          fetch-depth: 1
          ssh-key: ${{ secrets.CONFORMANCE_REPO_DEPLOY_KEY }}
          persist-credentials: true

      - name: Fetch the checked reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/conformance

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B scripts/conformance/publish.py --apply --checkout scarab-conformance \
            --identity 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' \
            "$RUNNER_TEMP/conformance"
