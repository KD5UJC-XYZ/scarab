# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scala:
    name: scalafmt, compile and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tested JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
          check-latest: false
          overwrite-settings: false
      - name: Cache sbt launcher, boot, ivy and coursier
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'scripts/sbtw') }}
          restore-keys: |
            sbt-${{ runner.os }}-
      - name: scalafmt, compile and all tests
        run: bash scripts/sbtw check node/runtimeClasspathFile

  scripts:
    name: scripts (compile, unit tests, help)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Byte-compile every script
        run: |
          find scripts -name '*.py' -print0 | xargs -0 python3 -c '
          import sys
          for path in sys.argv[1:]:
              compile(open(path, encoding="utf-8").read(), path, "exec")
              print("ok", path)
          '
      - name: Fixture identities and comparison contracts
        run: python3 scripts/check_test_coverage.py
      - name: Closed error channel guard
        run: python3 scripts/check_error_channels.py
      - name: Install pinned changelog tool in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/scarab-python-tests"
          "$RUNNER_TEMP/scarab-python-tests/bin/pip" install --require-hashes -r scripts/release/requirements.txt
      - name: Unit tests (no Docker)
        run: |
          "$RUNNER_TEMP/scarab-python-tests/bin/python" -m unittest discover -s scripts/tests -v
      - name: Every devnet subcommand parses its flags
        run: |
          python3 scripts/devnet.py --help > /dev/null
          for command in up up-eras capture-eras e2e tip follow load govload compare soak relay pool kes-rotate down; do
            python3 scripts/devnet.py "$command" --help > /dev/null
          done
          python3 scripts/prepare_reference_image.py --help > /dev/null
      - name: SPDX header on every script and workflow
        run: |
          missing=$(find scripts .github/workflows \( -name '*.py' -o -name '*.yml' -o -name sbtw \) \
            -exec grep -L 'SPDX-License-Identifier: Apache-2.0' {} +)
          if [ -n "$missing" ]; then echo "missing SPDX header:"; echo "$missing"; exit 1; fi

  workflows:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned container)
        run: docker run --rm --network none -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks 8.24.3, pinned by digest. Default rules plus .gitleaks.toml, whose allowlist is scoped to
      # generic-api-key, named fixture paths/historical commits and one exact public CHaP trust root.
      - name: gitleaks over every commit reachable from the checkout
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git /repo --log-opts="--full-history HEAD" --config /repo/.gitleaks.toml --no-banner --redact --verbose --exit-code 1
      - name: Check full-history scan isolation with synthetic Git histories
        run: python3 scripts/check_secret_scan_history.py
      - name: Check narrow secret-scan exceptions with synthetic controls
        run: python3 scripts/check_secret_scan.py

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Compares the dependency graph of the base and the head commit. sbt is not part of GitHub's own
      # dependency detection: the graph comes from the dependency-graph job below, submitted on every
      # push to main, so a pull request is compared against the last submitted snapshot of main.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  dependency-graph:
    name: submit sbt dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Needs the repository's dependency graph (enabled with Dependabot alerts).
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tested JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
          check-latest: false
          overwrite-settings: false
      - name: Install sbt launcher
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11
      - name: Submit the dependency graph to GitHub
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
        with:
          # Submit what we build and ship (compile, runtime) and what tests use. The Scala compiler's
          # own classpath (scala-tool: scala3-compiler, jline) and the scaladoc classpath
          # (scala-doc-tool: jackson, jsoup) are build tools, not on the node's runtime classpath.
          configs-ignore: scala-tool scala-doc-tool
