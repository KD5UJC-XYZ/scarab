# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
    branches: [main, dev, release/alpha, release/beta, release/preprod, release/prod]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scala:
    name: scalafmt, compile and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tested JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
          check-latest: false
          overwrite-settings: false
      - name: Cache sbt launcher, boot, ivy and coursier
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'project/*.scala', 'scripts/sbtw', 'scripts/prepare_scalus.py', 'patches/scalus/**') }}
          restore-keys: |
            sbt-${{ runner.os }}-
      - name: scalafmt, compile and all tests
        run: bash scripts/sbtw check node/runtimeClasspathFile
      - name: ADX/BMI2 code of the Linux/amd64 native libraries is behind the CPU switch
        run: |
          python3 scripts/check_native_isa.py blst-native/src/main/resources/supranational/blst/Linux/amd64/libblst.so
          mapfile -t jars < <(find .cache/scarab/coursier -name scalus-crypto-jni-0.1.0.jar)
          test "${#jars[@]}" -eq 1
          python3 scripts/check_native_isa.py "${jars[0]}" --member natives/linux_64/libscalus_crypto.so
      - name: Frozen release version controls in the JDK image
        run: |
          docker build -f docker/jdk.Dockerfile -t scarab-version-jdk:ci .
          docker run --rm --cpus=4 --user "$(id -u):$(id -g)" \
            -v "$PWD":/work -w /work -e HOME=/work/.cache/home \
            -e SCARAB_CACHE_DIR=/work/.cache -e SBT_GLOBAL_BASE=/tmp/sbt-version-ci \
            scarab-version-jdk:ci python3 -O scripts/check_build_identity.py

  scripts:
    name: scripts (compile, unit tests, help)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Byte-compile every script
        run: |
          find scripts -name '*.py' -print0 | xargs -0 python3 -c '
          import sys
          for path in sys.argv[1:]:
              compile(open(path, encoding="utf-8").read(), path, "exec")
              print("ok", path)
          '
      - name: Fixture identities and comparison contracts
        run: python3 scripts/check_test_coverage.py
      - name: Closed error channel guard
        run: python3 scripts/check_error_channels.py
      - name: No absolute home paths in tracked files
        run: python3 scripts/check_local_paths.py
      - name: Licence records (NOTICE, docs/licenses.md) cover every declared library
        run: python3 scripts/check_notice.py
      - name: Compatibility register (validation and generated docs/compatibility.md)
        run: python3 scripts/render_compatibility.py --check
      - name: Roadmap register (validation, generated docs/roadmap.md, item status against issue state)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/render_roadmap.py --check --require-issue-state ${PR_NUMBER:+--pr "$PR_NUMBER"}
      - name: Documentation drift (links, cited paths and symbols, reference pins; size budgets warn only)
        run: python3 scripts/check_docs.py
      - name: Code map is current (generated file, entry points, suites, documents, packages)
        run: python3 scripts/render_codemap.py --check
      - name: Install pinned changelog tool in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/scarab-python-tests"
          "$RUNNER_TEMP/scarab-python-tests/bin/pip" install --require-hashes -r scripts/release/requirements.txt
      - name: Unit tests (no Docker)
        run: |
          "$RUNNER_TEMP/scarab-python-tests/bin/python" -m unittest discover -s scripts/tests -v
      - name: Validate public verification schema with pinned JSON Schema controls
        run: |
          python3 -m venv "$RUNNER_TEMP/scarab-publication-schema"
          "$RUNNER_TEMP/scarab-publication-schema/bin/pip" install --require-hashes -r scripts/release/publication-requirements.txt
          "$RUNNER_TEMP/scarab-publication-schema/bin/python" scripts/check_publication_schema.py
      - name: Every devnet subcommand parses its flags
        run: |
          python3 scripts/devnet.py --help > /dev/null
          for command in up up-eras capture-eras e2e tip follow load govload compare soak relay pool kes-rotate faults down; do
            python3 scripts/devnet.py "$command" --help > /dev/null
          done
          python3 scripts/prepare_reference_image.py --help > /dev/null
      - name: SPDX header on every script and workflow
        run: |
          missing=$(find scripts .github/workflows \( -name '*.py' -o -name '*.yml' -o -name sbtw \) \
            -exec grep -L 'SPDX-License-Identifier: Apache-2.0' {} +)
          if [ -n "$missing" ]; then echo "missing SPDX header:"; echo "$missing"; exit 1; fi

  workflows:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned container)
        run: docker run --rm --network none -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks 8.24.3, pinned by digest. Default rules plus .gitleaks.toml, whose allowlist is scoped to
      # generic-api-key, named fixture paths/historical commits and one exact public CHaP trust root.
      - name: gitleaks over every commit reachable from the checkout
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git /repo --log-opts="--full-history HEAD" --config /repo/.gitleaks.toml --no-banner --redact --verbose --exit-code 1
      - name: Check full-history scan isolation with synthetic Git histories
        run: python3 scripts/check_secret_scan_history.py
      - name: Check narrow secret-scan exceptions with synthetic controls
        run: python3 scripts/check_secret_scan.py

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Compares the dependency graph of the base and the head commit. sbt is not part of GitHub's own
      # dependency detection: the graph comes from the dependency-graph job below, submitted on every
      # push to main, so a pull request is compared against the last submitted snapshot of main.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  dependency-graph:
    name: submit sbt dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Needs the repository's dependency graph (enabled with Dependabot alerts).
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache sbt launcher, boot, ivy and coursier
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'project/*.scala', 'scripts/sbtw', 'scripts/prepare_scalus.py', 'patches/scalus/**') }}
          restore-keys: |
            sbt-${{ runner.os }}-
      - name: Build the tested JDK image
        run: docker build -f docker/jdk.Dockerfile -t scarab-dependency-jdk:ci .
      - name: Use the prepared project launcher
        run: |
          mkdir -p "$RUNNER_TEMP/scarab-dependency-bin"
          install -m 755 scripts/dependency_sbt "$RUNNER_TEMP/scarab-dependency-bin/sbt"
          echo "$RUNNER_TEMP/scarab-dependency-bin" >> "$GITHUB_PATH"
      - name: Submit the dependency graph to GitHub
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
        with:
          # Submit what we build and ship (compile, runtime) and what tests use. The Scala compiler's
          # own classpath (scala-tool: scala3-compiler, jline) and the scaladoc classpath
          # (scala-doc-tool: jackson, jsoup) are build tools, not on the node's runtime classpath.
          configs-ignore: scala-tool scala-doc-tool
