# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
    branches: [main, dev, release/alpha, release/beta, release/preprod, release/prod]
  push:
    branches: [main]
  # A run started by hand runs the jobs below, among them the frozen release identity controls, which for now run
  # only so.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every other run, each push to main among them, has a group of
# its own, so it is never cancelled, and never replaced while it waits (guard `ci-parity`, scripts/guards.json).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the complete change
        id: classify
        run: python3 scripts/ci_changes.py

  # `check` built once, then its tests fanned out: this job runs `checkBuild` (`check` without the tests; build.sbt)
  # and the native guards, and hands its compiled output to the shards, which run every module's suites
  # (scripts/ci_test_shards.py) without compiling. "Scala tests and native guards" requires both.
  scala-build:
    name: Scala build, static checks and native guards
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require successful change classification
        env:
          CLASSIFY_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run }}
        run: |
          test "$CLASSIFY_RESULT" = success
          case "$RUN_CHECKS" in true) ;; false) echo 'Documentation-only: expensive checks not required' ;; *) exit 1 ;; esac
      - name: Check out source
        if: needs.changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tested JDK
        if: needs.changes.outputs.run == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
          check-latest: false
          overwrite-settings: false
      - name: Cache sbt launcher, boot, ivy and coursier
        if: needs.changes.outputs.run == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'project/*.scala', 'scripts/sbtw') }}
          restore-keys: |
            sbt-${{ runner.os }}-
      - name: scalafmt, headers, compile and scalafix (check without the tests), and the test suites
        if: needs.changes.outputs.run == 'true'
        run: bash scripts/sbtw checkBuild node/runtimeClasspathFile testSuiteInventory
      - name: Plan the test shards, every suite in exactly one
        if: needs.changes.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/scala-test-plan"
          python3 scripts/ci_test_shards.py plan --inventory target/ci/test-suites.tsv \
            --out "$RUNNER_TEMP/scala-test-plan/test-plan.json"
      - name: ADX/BMI2 code of the Linux/amd64 blst library is behind the CPU switch
        if: needs.changes.outputs.run == 'true'
        run: |
          mapfile -t jblst < <(find .cache/scarab/coursier -name 'jblst-*.jar' ! -name '*-sources.jar')
          test "${#jblst[@]}" -eq 1
          python3 scripts/check_native_identity.py "${jblst[0]}"
      # Every `target` directory: classes, zinc's analysis, generated sources and sbt's caches under `streams`,
      # the meta-build's `project/target` among them, as one file. The shards check out the same commit at the
      # same path, with the same JDK and dependency cache, so zinc finds nothing to compile; each shard refuses
      # a log that shows a compilation.
      - name: Pack the compiled output
        if: needs.changes.outputs.run == 'true'
        run: |
          mapfile -t outputs < <(find . \( -path ./.cache -o -path ./.git \) -prune -o -type d -name target -prune -print | sort)
          printf '%s\n' "${outputs[@]}"
          tar --format=posix --use-compress-program='zstd -T0 -3' -cf "$RUNNER_TEMP/scala-build.tar.zst" "${outputs[@]}"
          du -h "$RUNNER_TEMP/scala-build.tar.zst"
      - name: Upload the compiled output
        if: needs.changes.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scala-build
          path: ${{ runner.temp }}/scala-build.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Upload the test plan
        if: needs.changes.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scala-test-plan
          path: ${{ runner.temp }}/scala-test-plan
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  scala-shards:
    name: Scala tests, shard ${{ matrix.shard }}
    needs: [changes, scala-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require successful change classification
        env:
          CLASSIFY_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run }}
        run: |
          test "$CLASSIFY_RESULT" = success
          case "$RUN_CHECKS" in true) ;; false) echo 'Documentation-only: expensive checks not required' ;; *) exit 1 ;; esac
      - name: Check out source
        if: needs.changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tested JDK
        if: needs.changes.outputs.run == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
          check-latest: false
          overwrite-settings: false
      # Exactly the dependency cache the build job ran with, which it saved or found under this key; the shards only
      # read it, and a miss stops the shard at once: re-running all jobs saves the cache again.
      - name: Restore sbt launcher, boot, ivy and coursier
        if: needs.changes.outputs.run == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'project/*.scala', 'scripts/sbtw') }}
          fail-on-cache-miss: true
      - name: Download the compiled output
        if: needs.changes.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scala-build
          path: ${{ runner.temp }}/scala-build
      - name: Download the test plan
        if: needs.changes.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scala-test-plan
          path: ${{ runner.temp }}/scala-test-plan
      - name: Unpack the compiled output where the build job wrote it
        if: needs.changes.outputs.run == 'true'
        run: tar --use-compress-program=zstd -xf "$RUNNER_TEMP/scala-build/scala-build.tar.zst"
      - name: The shard's suites
        if: needs.changes.outputs.run == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 scripts/ci_test_shards.py commands --plan "$RUNNER_TEMP/scala-test-plan/test-plan.json" \
            --shard "$SHARD" > "$RUNNER_TEMP/shard-commands.txt"
          mapfile -t commands < "$RUNNER_TEMP/shard-commands.txt"
          test "${#commands[@]}" -gt 0
          printf '%s\n' "${commands[@]}"
          bash scripts/sbtw "${commands[@]}" 2>&1 | tee "$RUNNER_TEMP/shard.log"
      - name: The shard compiled nothing
        if: needs.changes.outputs.run == 'true'
        run: python3 scripts/ci_test_shards.py compiled "$RUNNER_TEMP/shard.log"
      - name: Collect the shard's test reports
        if: needs.changes.outputs.run == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 scripts/ci_test_shards.py collect --plan "$RUNNER_TEMP/scala-test-plan/test-plan.json" \
            --shard "$SHARD" --out "$RUNNER_TEMP/scala-test-reports"
      - name: Upload the shard's test reports
        if: needs.changes.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scala-test-reports-${{ matrix.shard }}
          path: ${{ runner.temp }}/scala-test-reports
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  scala-tests:
    name: Scala tests and native guards
    needs: [changes, scala-build, scala-shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require successful change classification
        env:
          CLASSIFY_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run }}
        run: |
          test "$CLASSIFY_RESULT" = success
          case "$RUN_CHECKS" in true) ;; false) echo 'Documentation-only: expensive checks not required' ;; *) exit 1 ;; esac
      - name: Require the build, its static checks and native guards, and every test shard
        if: needs.changes.outputs.run == 'true'
        env:
          BUILD_RESULT: ${{ needs.scala-build.result }}
          SHARDS_RESULT: ${{ needs.scala-shards.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SHARDS_RESULT" = success
      - name: Check out source
        if: needs.changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the test plan
        if: needs.changes.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scala-test-plan
          path: ${{ runner.temp }}/scala-test-plan
      - name: Download every shard's test reports
        if: needs.changes.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scala-test-reports-*
          merge-multiple: true
          path: ${{ runner.temp }}/scala-test-reports
      - name: Every suite ran once, in its shard, and passed
        if: needs.changes.outputs.run == 'true'
        run: |
          python3 scripts/ci_test_shards.py verify --plan "$RUNNER_TEMP/scala-test-plan/test-plan.json" \
            --reports "$RUNNER_TEMP/scala-test-reports"

  # Paused on pull requests and pushes, and left out of the required summary below, until releases start from main;
  # docs/design/releases.md#release-checks-paused-until-releases-start-from-main says how to restore it.

  build-identity:
    name: frozen release identity controls
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache identity-control sbt dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/scarab
          key: build-identity-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'project/*.scala', 'scripts/sbtw', 'scripts/check_build_identity.py', 'docker/jdk.Dockerfile') }}
          restore-keys: |
            build-identity-${{ runner.os }}-
            sbt-${{ runner.os }}-
      - name: Frozen release version controls in the JDK image
        run: |
          docker build -f docker/jdk.Dockerfile -t scarab-version-jdk:ci .
          docker run --rm --cpus=4 --user "$(id -u):$(id -g)" \
            -v "$PWD":/work -w /work -e HOME=/work/.cache/scarab/home \
            -e SCARAB_CACHE_DIR=/work/.cache -e SBT_GLOBAL_BASE=/tmp/sbt-version-ci \
            scarab-version-jdk:ci python3 -O scripts/check_build_identity.py

  scala:
    name: scalafmt, compile and test
    needs: [scala-build, scala-shards, scala-tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the Scala build, every test shard, and Scala tests and native guards
        env:
          BUILD_RESULT: ${{ needs.scala-build.result }}
          SHARDS_RESULT: ${{ needs.scala-shards.result }}
          SCALA_RESULT: ${{ needs.scala-tests.result }}
        shell: bash
        run: |
          test "$BUILD_RESULT" = success
          test "$SHARDS_RESULT" = success
          test "$SCALA_RESULT" = success

  scripts:
    name: scripts (compile, unit tests, help)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Two commits deep, so that on a pull request the merge commit's first parent, the target branch, is there:
      # the correspondence guard compares its baseline with the target's.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Byte-compile every script
        run: |
          find scripts -name '*.py' -print0 | xargs -0 python3 -c '
          import sys
          for path in sys.argv[1:]:
              compile(open(path, encoding="utf-8").read(), path, "exec")
              print("ok", path)
          '
      # The Python guards are registered once, in scripts/guards.json, which scripts/preflight runs too. Every
      # guard runs, each in a group of the log, and the step fails if any failed.
      - name: Python guards (scripts/guards.json)
        run: python3 scripts/guards.py
      - name: Install pinned changelog tool in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/scarab-python-tests"
          "$RUNNER_TEMP/scarab-python-tests/bin/pip" install --require-hashes -r scripts/release/requirements.txt
      - name: Unit tests (no Docker)
        run: |
          "$RUNNER_TEMP/scarab-python-tests/bin/python" -m unittest discover -s scripts/tests -v
      - name: Validate public verification schema with pinned JSON Schema controls
        run: |
          python3 -m venv "$RUNNER_TEMP/scarab-publication-schema"
          "$RUNNER_TEMP/scarab-publication-schema/bin/pip" install --require-hashes -r scripts/release/publication-requirements.txt
          "$RUNNER_TEMP/scarab-publication-schema/bin/python" scripts/check_publication_schema.py
      - name: Every devnet subcommand parses its flags
        run: |
          python3 scripts/devnet.py --help > /dev/null
          for command in up up-eras capture-eras e2e tip follow load govload compare soak relay pool kes-rotate dynamic-forging faults down; do
            python3 scripts/devnet.py "$command" --help > /dev/null
          done
          python3 scripts/prepare_reference_image.py --help > /dev/null
      - name: SPDX header on every script and workflow
        run: |
          missing=$(find scripts .github/workflows \( -name '*.py' -o -name '*.yml' -o -name sbtw \) \
            -exec grep -L 'SPDX-License-Identifier: Apache-2.0' {} +)
          if [ -n "$missing" ]; then echo "missing SPDX header:"; echo "$missing"; exit 1; fi

  workflows:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned container)
        run: docker run --rm --network none -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks 8.24.3, pinned by digest. Default rules plus .gitleaks.toml, whose allowlist is scoped to
      # generic-api-key, named fixture paths/historical commits and one exact public CHaP trust root.
      - name: gitleaks over every commit reachable from the checkout
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git /repo --log-opts="--full-history HEAD" --config /repo/.gitleaks.toml --no-banner --redact --verbose --exit-code 1
      - name: Check full-history scan isolation with synthetic Git histories
        run: python3 scripts/check_secret_scan_history.py
      - name: Check narrow secret-scan exceptions with synthetic controls
        run: python3 scripts/check_secret_scan.py

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Compares the dependency graph of the base and the head commit. sbt is not part of GitHub's own
      # dependency detection, and nothing submits a pull request head's sbt graph automatically
      # (dependency-graph.yml submits main's daily), so the review is not shown to cover sbt dependencies.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
