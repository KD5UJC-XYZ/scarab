# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scala:
    name: scalafmt, compile and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tested JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
          check-latest: false
          overwrite-settings: false
      - name: Cache sbt launcher, boot, ivy and coursier
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/cardano-scala-lab
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/repositories', 'scripts/sbtw') }}
          restore-keys: |
            sbt-${{ runner.os }}-
      - name: scalafmt, compile and all tests
        run: bash scripts/sbtw check node/runtimeClasspathFile

  scripts:
    name: scripts (compile, unit tests, help)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Byte-compile every script
        run: |
          find scripts -name '*.py' -print0 | xargs -0 python3 -c '
          import sys
          for path in sys.argv[1:]:
              compile(open(path, encoding="utf-8").read(), path, "exec")
              print("ok", path)
          '
      - name: Unit tests (no Docker)
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Every devnet subcommand parses its flags
        run: |
          python3 scripts/devnet.py --help > /dev/null
          for command in up up-eras capture-eras e2e tip follow load govload compare soak relay pool down; do
            python3 scripts/devnet.py "$command" --help > /dev/null
          done
          python3 scripts/prepare_reference_image.py --help > /dev/null
      - name: SPDX header on every script and workflow
        run: |
          missing=$(find scripts .github \( -name '*.py' -o -name '*.yml' -o -name sbtw \) \
            -exec grep -L 'SPDX-License-Identifier: Apache-2.0' {} +)
          if [ -n "$missing" ]; then echo "missing SPDX header:"; echo "$missing"; exit 1; fi

  workflows:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned container)
        run: docker run --rm --network none -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
