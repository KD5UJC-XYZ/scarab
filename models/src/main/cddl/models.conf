# Generator configuration of the models spike. See docs/models.md and Config.scala for the directives.
# Roots cover protocols, era blocks and transactions, and conformance regression schemas.

package xyz.kd5ujc.scarab.models

# --- ouroboros-network: mini-protocols (SOURCES: pinned commits) -------------------------------------
module network.base                  common       upstream/ouroboros-network/cardano-diffusion/protocols/cddl/specs/network.base.cddl overrides/network-base.cddl
module chain-sync                    chainsync    upstream/ouroboros-network/cardano-diffusion/protocols/cddl/specs/chain-sync.cddl
module handshake-node-to-node-v14    handshake    upstream/ouroboros-network/cardano-diffusion/protocols/cddl/specs/handshake-node-to-node-v14.cddl
module peer-sharing-v14                peersharing  upstream/ouroboros-network/cardano-diffusion/protocols/cddl/specs/peer-sharing-v14.cddl
module node-to-node-version-data-v14 handshake.v14 upstream/ouroboros-network/cardano-diffusion/protocols/cddl/specs/node-to-node-version-data-v14.cddl
module node-to-node-version-data-v16 handshake.v16 upstream/ouroboros-network/cardano-diffusion/protocols/cddl/specs/node-to-node-version-data-v16.cddl

# --- ouroboros-consensus: the hard-fork-combinator header envelope -----------------------------------
module base                          chain        upstream/ouroboros-consensus/ouroboros-consensus-cardano/cddl/base.cddl overrides/base-word16.cddl
module chainsync-header              chain.hfc    upstream/ouroboros-consensus/ouroboros-consensus-cardano/cddl/node-to-node/chainsync/header.cddl

# --- ouroboros-consensus main: the LeiosNotify messages (N3). The file imports the ChainSync header as
# --- `header`, so the same header.cddl is a second module of that name (its own package).
module header                        chain.leiosheader upstream/ouroboros-consensus/ouroboros-consensus-cardano/cddl/node-to-node/chainsync/header.cddl
module leios-notify                  leios.notify upstream/ouroboros-consensus/ouroboros-consensus-cardano/cddl/node-to-node/leiosnotify/leiosNotify.cddl

# --- cardano-blueprint 0460c5a6: the LeiosFetch messages (X12). No consensus or network branch has a LeiosFetch
# --- CDDL; the Blueprint's file imports `base` (the module above, which only lacks word16: overrides/base-word16.cddl)
# --- and includes `dijkstra` (the era module below) for `dijkstra.block_transaction`.
module leios-fetch                   leios.fetch  upstream/cardano-blueprint/src/network/node-to-node/leios-fetch/messages.cddl

# --- cardano-ledger: one module (and Scala package) per era ------------------------------------------
module byron                         byron        upstream/cardano-ledger/eras/byron/ledger/impl/cddl-spec/byron.cddl
module shelley                       shelley      upstream/cardano-ledger/eras/shelley/impl/cddl/data/shelley.cddl
module allegra                       allegra      upstream/cardano-ledger/eras/allegra/impl/cddl/data/allegra.cddl
module mary                          mary         upstream/cardano-ledger/eras/mary/impl/cddl/data/mary.cddl
module alonzo                        alonzo       upstream/cardano-ledger/eras/alonzo/impl/cddl/data/alonzo.cddl overrides/bounded-bytes.cddl
module babbage                       babbage      upstream/cardano-ledger/eras/babbage/impl/cddl/data/babbage.cddl overrides/bounded-bytes.cddl
module conway                        conway       upstream/cardano-ledger/eras/conway/impl/cddl/data/conway.cddl overrides/bounded-bytes.cddl
module dijkstra                      dijkstra     upstream/cardano-ledger/eras/dijkstra/impl/cddl/data/dijkstra.cddl

# --- the reference decodes these eras' multi-asset maps with a plain `decodeMap` (empty inner maps accepted and pruned
# --- below decoder version 9), while the CDDL says `{ + asset_name => a }`; the generated maps keep the reference's
# --- leniency (cardano-ledger Mary/Value.hs `decodeMultiAsset`, `decodeWithPrunning`; docs/models.md section 2).
lenient-maps mary
lenient-maps alonzo
lenient-maps babbage

# --- feature coverage (our own schema; see features.cddl) -------------------------------------------------
module features                      features    features.cddl

# --- roots --------------------------------------------------------------------------------------------
root handshake-node-to-node-v14:handshakeMessage
root chain-sync:chainSyncMessage
root peer-sharing-v14:peerSharingMessage
root leios-notify:leiosNotifyMessage
root leios-fetch:leiosBlockFetchMessage
root conway:header
root conway:block
root conway:transaction
root shelley:block
root allegra:block
root mary:block
root alonzo:block
root babbage:block
root features:transaction
root features:key_descriptor
root features:person
root features:prelude_use

# --- declared properties: the header and its body are signed (KES) and hashed (block hash) -----------
preserve byron:blockhead
preserve byron:ebbhead
preserve shelley:header
preserve shelley:header_body
preserve allegra:header
preserve allegra:header_body
preserve mary:header
preserve mary:header_body
preserve alonzo:header
preserve alonzo:header_body
preserve babbage:header
preserve babbage:header_body
preserve conway:header
preserve conway:header_body
preserve dijkstra:header
preserve dijkstra:header_body

# --- names the CDDL leaves anonymous -------------------------------------------------------------------
cases   base:point                   Origin Block
cases   handshake-node-to-node-v14:msgAcceptVersion V14ToV15 V16
cases   handshake-node-to-node-v14:versionNumbers   V14ToV15 V16ToLast
strip   handshake-node-to-node-v14:handshakeMessage msg
strip   handshake-node-to-node-v14:refuseReason     refuseReason
strip   chain-sync:chainSyncMessage                 msg chainSyncMsg
cases   chainsync-header:byronHeader Regular Boundary
cases   chainsync-header:header      Dijkstra Conway Babbage Alonzo Mary Allegra Shelley Byron
cases   header:byronHeader           Regular Boundary
cases   header:header                Dijkstra Conway Babbage Alonzo Mary Allegra Shelley Byron
strip   leios-notify:leiosNotifyMessage msg

# --- member names the CDDL leaves anonymous (array position -> name) --------------------------------------
field shelley:vrf_cert 0 output
field shelley:vrf_cert 1 proof
field shelley:protocol_version 0 major
field shelley:protocol_version 1 minor
field allegra:vrf_cert 0 output
field allegra:vrf_cert 1 proof
field allegra:protocol_version 0 major
field allegra:protocol_version 1 minor
field mary:vrf_cert 0 output
field mary:vrf_cert 1 proof
field mary:protocol_version 0 major
field mary:protocol_version 1 minor
field alonzo:vrf_cert 0 output
field alonzo:vrf_cert 1 proof
field alonzo:protocol_version 0 major
field alonzo:protocol_version 1 minor
field babbage:vrf_cert 0 output
field babbage:vrf_cert 1 proof
field babbage:protocol_version 0 major
field babbage:protocol_version 1 minor
field conway:vrf_cert 0 output
field conway:vrf_cert 1 proof
field conway:protocol_version 0 major
field conway:protocol_version 1 minor
field dijkstra:vrf_cert 0 output
field dijkstra:vrf_cert 1 proof
field dijkstra:protocol_version 0 major
field dijkstra:protocol_version 1 minor

