rules = [OrganizeImports]

# Imports keep the order they are written in (own packages first, then libraries): the sorted and
# merged form rewrites every file and, with several wildcards in one statement, is not always valid
# Scala 3. The rule still keeps the blank lines between the groups uniform.
# To sort everything once: importsOrder = Ascii, groupedImports = Merge, then `scalafixAll` and
# `scalafmtAll`, and review the diff.
OrganizeImports {
  targetDialect = Scala3
  groups = ["*"]
  importsOrder = Keep
  importSelectorsOrder = Keep
  groupedImports = Keep
  removeUnused = false
}
