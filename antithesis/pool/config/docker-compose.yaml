# SPDX-License-Identifier: Apache-2.0
# The first Antithesis trial cluster: two Haskell cardano-node 11.1.3 pools (h2, h3) and one Scarab pool (s1) on pool
# 1's keys, a one-shot configurator that writes the genesis, keys and topologies, and the fault-excluded driver.
# No restart policies: Antithesis restarts what it kills.

x-labels: &labels
  xyz.kd5ujc.scarab.kind: antithesis-pool
  xyz.kd5ujc.scarab.owner: antithesis

x-after-configurator: &after-configurator
  configurator:
    condition: service_completed_successfully

services:
  configurator:
    container_name: configurator
    hostname: configurator
    image: scarab-at-cardano:trial
    platform: linux/amd64
    command: ["/opt/at/configure.sh"]
    labels: *labels
    volumes:
      - env:/env

  h2:
    container_name: h2
    hostname: h2
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "2"]
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h2:/ipc

  h3:
    container_name: h3
    hostname: h3
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "3"]
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h3:/ipc

  s1:
    container_name: s1
    hostname: s1
    image: scarab-at-scarab:trial
    platform: linux/amd64
    init: true
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-s1:/ipc

  driver:
    container_name: driver
    hostname: driver
    image: scarab-at-driver:trial
    platform: linux/amd64
    init: true
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - ipc-h2:/ipc/h2
      - ipc-h3:/ipc/h3
      - ipc-s1:/ipc/s1

volumes:
  env:
  ipc-h2:
  ipc-h3:
  ipc-s1:
