# SPDX-License-Identifier: Apache-2.0
# The control of ../config: the same cluster, start order, faults, properties and workload, with pool 1 run by
# cardano-node 11.1.3 in s1's seat instead of Scarab. Its question: how often does the reference fork, refuse or lag
# under the same faults? Scarab's own detectors (its metrics, its fatal and clock events) have nothing to read here and
# stay quiet.

x-labels: &labels
  xyz.kd5ujc.scarab.kind: antithesis-pool-reference
  xyz.kd5ujc.scarab.owner: antithesis

x-after-configurator: &after-configurator
  configurator:
    condition: service_completed_successfully

# The pools' containers start once s1's has: Docker's DNS knows a name only while its container runs, so s1's name
# resolves at the pools' first lookup. The node in s1 still waits until both pools listen (WAIT_FOR).
x-after-s1: &after-s1
  configurator:
    condition: service_completed_successfully
  s1:
    condition: service_started

# s1 dials both Haskell pools at once, so it starts only when they listen (cardano/listening.sh, issue 609).
x-listening: &listening
  test: ["CMD", "/opt/at/listening.sh", "3001"]
  interval: 1s
  timeout: 5s
  retries: 600

services:
  configurator:
    container_name: configurator
    hostname: configurator
    image: scarab-at-cardano:trial
    platform: linux/amd64
    command: ["/opt/at/configure.sh"]
    labels: *labels
    volumes:
      - env:/env

  h2:
    container_name: h2
    hostname: h2
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "2"]
    healthcheck: *listening
    labels: *labels
    depends_on: *after-s1
    volumes:
      - env:/env:ro
      - ipc-h2:/ipc
      - logs:/logs

  h3:
    container_name: h3
    hostname: h3
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "3"]
    healthcheck: *listening
    labels: *labels
    depends_on: *after-s1
    volumes:
      - env:/env:ro
      - ipc-h3:/ipc
      - logs:/logs

  s1:
    container_name: s1
    hostname: s1
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "1", "s1"]
    environment:
      WAIT_FOR: "h2:3001 h3:3001"
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-s1:/ipc
      - logs:/logs

  driver:
    container_name: driver
    hostname: driver
    image: scarab-at-driver:trial
    platform: linux/amd64
    init: true
    environment:
      S1_IMPLEMENTATION: cardano-node
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - ipc-h2:/ipc/h2
      - ipc-h3:/ipc/h3
      - env:/env:ro
      - ipc-s1:/ipc/s1
      - logs:/logs:ro

volumes:
  env:
  ipc-h2:
  ipc-h3:
  ipc-s1:
  logs:
