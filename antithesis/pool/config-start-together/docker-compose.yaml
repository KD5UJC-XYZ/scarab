# SPDX-License-Identifier: Apache-2.0
# The cluster of ../config, with s1's container started together with the pools: an experiment beside ../config.
# Docker's DNS knows a container's name only while it runs, and in ../config s1's container starts once the pools are
# healthy. Their first lookup of s1 then fails with NXDOMAIN, and the reference waits 900 s before the next one
# (`ttlForDnsError _ NameError = maxTTL`, ouroboros-network LocalRootPeers.hs:307; Scarab the same). For those 15
# minutes they take none of s1's blocks, which split the cluster in run 1b7f22e1. Here s1's name resolves from the
# start, and Scarab itself still starts only once both pools listen (WAIT_FOR, issue 609). Its question: is that
# window the whole story of the startup splits?
# No restart policies: Antithesis restarts what it kills.

x-labels: &labels
  xyz.kd5ujc.scarab.kind: antithesis-pool-start-together
  xyz.kd5ujc.scarab.owner: antithesis

x-after-configurator: &after-configurator
  configurator:
    condition: service_completed_successfully

# s1 dials both Haskell pools at once, so it starts only when they listen (cardano/listening.sh, issue 609).
x-listening: &listening
  test: ["CMD", "/opt/at/listening.sh", "3001"]
  interval: 1s
  timeout: 5s
  retries: 600

services:
  configurator:
    container_name: configurator
    hostname: configurator
    image: scarab-at-cardano:trial
    platform: linux/amd64
    command: ["/opt/at/configure.sh"]
    labels: *labels
    volumes:
      - env:/env

  h2:
    container_name: h2
    hostname: h2
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "2"]
    healthcheck: *listening
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h2:/ipc
      - logs:/logs

  h3:
    container_name: h3
    hostname: h3
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "3"]
    healthcheck: *listening
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h3:/ipc
      - logs:/logs

  s1:
    container_name: s1
    hostname: s1
    image: scarab-at-scarab:trial
    platform: linux/amd64
    init: true
    environment:
      WAIT_FOR: "h2:3001 h3:3001"
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-s1:/ipc
      - logs:/logs

  driver:
    container_name: driver
    hostname: driver
    image: scarab-at-driver:trial
    platform: linux/amd64
    init: true
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - ipc-h2:/ipc/h2
      - ipc-h3:/ipc/h3
      - env:/env:ro
      - ipc-s1:/ipc/s1
      - logs:/logs:ro

volumes:
  env:
  ipc-h2:
  ipc-h3:
  ipc-s1:
  logs:
