# SPDX-License-Identifier: Apache-2.0
# A stated experiment on ../config-canary: the same canary at create-env's k = 5 and 500-slot epochs, s1's container
# started with the pools. Every config-canary run at k = 20 (4,000-slot epochs) ended "incomplete" on the platform at
# about 1 h 15 min with no property report, with or without setup complete. Its setup takes about 875 s of virtual
# time, for the two epoch boundaries its governance change needs. The runs at k = 5 completed in about 31 minutes.
# This asks whether a short setup lets the run complete with its report. The k = 20 canary was chosen against a
# start split that came from s1 starting late (Docker's DNS has no name for s1 yet, and the pools wait 900 s after
# that NXDOMAIN); here s1 starts with the pools.
#
# The writeBits canary (GHSA-vfw2-hhrc-87v5): the cluster of ../config at protocol 11, whose driver's first command
# submits the canary transaction to s1. Against Scarab before the fix, the detectors "a Haskell pool never refuses a
# block as invalid" and "Scarab never refuses a block as invalid" fail.
# No restart policies: Antithesis restarts what it kills.

x-labels: &labels
  xyz.kd5ujc.scarab.kind: antithesis-canary
  xyz.kd5ujc.scarab.owner: antithesis

x-after-configurator: &after-configurator
  configurator:
    condition: service_completed_successfully

# s1 dials both Haskell pools at once, so it starts only when they listen (cardano/listening.sh, issue 609).
x-listening: &listening
  test: ["CMD", "/opt/at/listening.sh", "3001"]
  interval: 1s
  timeout: 5s
  retries: 600

services:
  configurator:
    container_name: configurator
    hostname: configurator
    image: scarab-at-cardano:trial
    platform: linux/amd64
    command: ["/opt/at/configure.sh"]
    environment:
      PROTOCOL_MAJOR: "11"
    labels: *labels
    volumes:
      - env:/env
      - ./conway-genesis-overlay.json:/config/conway-genesis-overlay.json:ro

  h2:
    container_name: h2
    hostname: h2
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "2"]
    healthcheck: *listening
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h2:/ipc
      - logs:/logs

  h3:
    container_name: h3
    hostname: h3
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "3"]
    healthcheck: *listening
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h3:/ipc
      - logs:/logs

  s1:
    container_name: s1
    hostname: s1
    image: scarab-at-scarab:trial
    platform: linux/amd64
    init: true
    # s1's container starts with the pools, so that its name resolves from their first lookup, and the node waits
    # inside it until both listen (see ../config-start-together): the canary needs a cluster that is together.
    environment:
      WAIT_FOR: "h2:3001 h3:3001"
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-s1:/ipc
      - logs:/logs

  driver:
    container_name: driver
    hostname: driver
    image: scarab-at-canary:trial
    platform: linux/amd64
    init: true
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h2:/ipc/h2
      - ipc-h3:/ipc/h3
      - ipc-s1:/ipc/s1
      - logs:/logs:ro

volumes:
  env:
  ipc-h2:
  ipc-h3:
  ipc-s1:
  logs:
