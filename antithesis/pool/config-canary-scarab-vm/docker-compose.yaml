# SPDX-License-Identifier: Apache-2.0
# A stated experiment on ../config-canary: the same canary with s1 on Scarab's own Plutus evaluator
# (`--plutus-vm scarab`, ADR 0027), which forges since the owner's decision of 2026-11-13. The GHSA-vfw2-hhrc-87v5
# fix was made in the Scalus path; the own evaluator has a limit of its own (`uplc` `Bitwise.writeBits`, applied in the
# semantics variants that bound it). This asks whether s1 on the own evaluator refuses the 4,097-byte `writeBits` mint
# at its mempool too, end to end, and holds with the pools under the detectors.
#
# The writeBits canary (GHSA-vfw2-hhrc-87v5): the cluster of ../config at protocol 11, whose driver's first command
# submits the canary transaction to s1. Against Scarab before the fix, the detectors "a Haskell pool never refuses a
# block as invalid" and "Scarab never refuses a block as invalid" fail.
# No restart policies: Antithesis restarts what it kills.

x-labels: &labels
  xyz.kd5ujc.scarab.kind: antithesis-canary
  xyz.kd5ujc.scarab.owner: antithesis

x-after-configurator: &after-configurator
  configurator:
    condition: service_completed_successfully

# s1 dials both Haskell pools at once, so it starts only when they listen (cardano/listening.sh, issue 609).
x-listening: &listening
  test: ["CMD", "/opt/at/listening.sh", "3001"]
  interval: 1s
  timeout: 5s
  retries: 600

services:
  configurator:
    container_name: configurator
    hostname: configurator
    image: scarab-at-cardano:trial
    platform: linux/amd64
    command: ["/opt/at/configure.sh"]
    environment:
      PROTOCOL_MAJOR: "11"
    labels: *labels
    volumes:
      - env:/env
      - ./conway-genesis-overlay.json:/config/conway-genesis-overlay.json:ro

  h2:
    container_name: h2
    hostname: h2
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "2"]
    healthcheck: *listening
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h2:/ipc
      - logs:/logs

  h3:
    container_name: h3
    hostname: h3
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "3"]
    healthcheck: *listening
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h3:/ipc
      - logs:/logs

  s1:
    container_name: s1
    hostname: s1
    image: scarab-at-scarab:trial
    platform: linux/amd64
    init: true
    # s1's container starts with the pools, so that its name resolves from their first lookup, and the node waits
    # inside it until both listen (as in ../config): the canary needs a cluster that is together.
    environment:
      WAIT_FOR: "h2:3001 h3:3001"
      PLUTUS_VM: scarab
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-s1:/ipc
      - logs:/logs

  driver:
    container_name: driver
    hostname: driver
    image: scarab-at-canary:trial
    platform: linux/amd64
    init: true
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h2:/ipc/h2
      - ipc-h3:/ipc/h3
      - ipc-s1:/ipc/s1
      - logs:/logs:ro

volumes:
  env:
  ipc-h2:
  ipc-h3:
  ipc-s1:
  logs:
