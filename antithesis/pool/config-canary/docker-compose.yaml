# SPDX-License-Identifier: Apache-2.0
# The writeBits canary (GHSA-vfw2-hhrc-87v5): the cluster of ../config at protocol 11, with the Haskell pools' logs
# shared with the driver, whose first command submits the canary transaction to s1 and whose watcher reports a
# block a Haskell pool refused. Against Scarab before the fix, "a Haskell pool never refuses a block as invalid" fails.
# No restart policies: Antithesis restarts what it kills.

x-labels: &labels
  xyz.kd5ujc.scarab.kind: antithesis-canary
  xyz.kd5ujc.scarab.owner: antithesis

x-after-configurator: &after-configurator
  configurator:
    condition: service_completed_successfully

# s1 dials both Haskell pools at once, so it starts only when they listen (cardano/listening.sh, issue 609).
x-listening: &listening
  test: ["CMD", "/opt/at/listening.sh", "3001"]
  interval: 1s
  timeout: 5s
  retries: 600

services:
  configurator:
    container_name: configurator
    hostname: configurator
    image: scarab-at-cardano:trial
    platform: linux/amd64
    command: ["/opt/at/configure.sh"]
    environment:
      PROTOCOL_MAJOR: "11"
    labels: *labels
    volumes:
      - env:/env
      - ./conway-genesis-overlay.json:/config/conway-genesis-overlay.json:ro

  h2:
    container_name: h2
    hostname: h2
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "2"]
    healthcheck: *listening
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h2:/ipc
      - logs:/logs

  h3:
    container_name: h3
    hostname: h3
    image: scarab-at-cardano:trial
    platform: linux/amd64
    init: true
    command: ["/opt/at/haskell-node.sh", "3"]
    healthcheck: *listening
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h3:/ipc
      - logs:/logs

  s1:
    container_name: s1
    hostname: s1
    image: scarab-at-scarab:trial
    platform: linux/amd64
    init: true
    labels: *labels
    depends_on:
      configurator:
        condition: service_completed_successfully
      h2:
        condition: service_healthy
      h3:
        condition: service_healthy
    volumes:
      - env:/env:ro
      - ipc-s1:/ipc

  driver:
    container_name: driver
    hostname: driver
    image: scarab-at-canary:trial
    platform: linux/amd64
    init: true
    labels: *labels
    depends_on: *after-configurator
    volumes:
      - env:/env:ro
      - ipc-h2:/ipc/h2
      - ipc-h3:/ipc/h3
      - ipc-s1:/ipc/s1
      - logs:/logs:ro

volumes:
  env:
  ipc-h2:
  ipc-h3:
  ipc-s1:
  logs:
