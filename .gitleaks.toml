# SPDX-License-Identifier: Apache-2.0
#
# gitleaks configuration (CI job "secret scan", .github/workflows/ci.yml).
#
# The default rule set stays on. The only rule that fires on this repository is generic-api-key, and
# every hit is public data that merely looks like a key to an entropy check: Ed25519 verification
# keys, key hashes and SHA-256 file digests in committed fixtures and in manifests. A manual scan of
# the whole history before v0.1.0 found 182 such hits and nothing else. The allowlist below is
# scoped to that one rule, and to named paths and named commits, so every other rule still applies
# everywhere and a real secret in any other file is reported.
#
# Do not add `.skey`, `.key` or other signing material here. Those are never committed
# (see CONTRIBUTING.md and .gitignore).

title = "Scarab gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[rules.allowlist]
description = "public key hashes, verification keys and SHA-256 digests (fixtures, manifests, historical scripts)"
paths = [
  # Fixtures are public chain data or throwaway keys (fixtures/*/README.md and NOTICE record provenance).
  '''^fixtures/''',
  # A public operational-certificate verification key used as an expected value: the file now, and
  # where it was before the package rename (the scan covers the whole history, so both paths stay).
  '''^node/src/test/scala/xyz/kd5ujc/scarab/node/forge/KeyFilesSuite\.scala$''',
  '''^node/src/test/scala/lab/node/forge/KeyFilesSuite\.scala$''',
  # A mainnet transaction id (public chain data) held in a constant named Key.
  '''^node/src/test/scala/xyz/kd5ujc/scarab/storage/ByronHandoverUtxoSuite\.scala$''',
]
commits = [
  # 87cf584: removed nonce-epoch tooling; the match is the string "pre-anchor-supplied-verification-keys-v1".
  "87cf584de722c3ff55366e7d47702384ac5b2c25",
  # a32e816: removed fixture-projection scripts and docs; the matches are SHA-256 digests and source commit ids.
  "a32e816840fc99db862c85ec80129b50a0ff871d",
  # The same two commits after the history rewrite of 2026-10-16 (text scrubbed, content otherwise equal);
  # the old ids stay for clones made before it.
  "3c0e74cb7ce8eeea25b3dc45cabbdc6a00417aac",
  "58172e52dc4054e627a18647477c6bd6953361d7",
]
