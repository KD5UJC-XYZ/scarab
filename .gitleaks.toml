# SPDX-License-Identifier: Apache-2.0
#
# gitleaks configuration (CI job "secret scan", .github/workflows/ci.yml).
#
# The default rule set stays on, plus two rules for Cardano key material:
# - cardano-text-envelope-signing-key matches a cardano-cli TextEnvelope whose "type" names a SigningKey
#   and whose "cborHex" carries the key bytes (payment, stake, pool, KES and VRF signing keys);
# - cardano-signing-key-file matches any *.skey path.
# generic-api-key is the only default rule that fires on this repository, and every hit is public data that
# merely looks like a key to an entropy check: Ed25519 verification keys, key hashes and SHA-256 file digests
# in committed fixtures and in manifests. The allowlist is scoped to that one rule, and to named fixture
# files, commits and exact public values. Every other rule still applies everywhere; the exact-value
# exception does not hide different tokens in the same file.
#
# Do not allowlist signing material here: signing keys are never committed (see CONTRIBUTING.md and
# .gitignore), and the custom rules exist to catch them.

title = "Scarab gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "public key hashes, verification keys, SHA-256 digests and exact CHaP trust root"
# CHaP's public repository trust root, published in its README at pinned metadata b2f313b6.
# Match only the complete extracted public value; other generic tokens in the same file still scan.
regexTarget = "secret"
regexes = ['''^3e0cce471cf09815f930210f7827266fd09045445d65923e6d0238a6cd15126f$''']
paths = [
  # Fixtures are public chain data (fixtures/*/README.md and NOTICE record provenance). One entry per file that
  # the full-history scan reports for generic-api-key; a new fixture with a flagged value needs its own entry.
  '''^fixtures/devnet/lsq/genesis/shelley-genesis\.json$''',
  '''^fixtures/leios/testnet/config/shelley-genesis\.json$''',
  '''^fixtures/mainnet/byron-genesis-trimmed\.json$''',
  '''^fixtures/mainnet/genesis/byron-genesis\.json$''',
  '''^fixtures/preview/conway-governance\.json$''',
  '''^fixtures/reference/ledger-api-pool-goldens/head/queryPoolParameters\.json$''',
  '''^fixtures/reference/ledger-api-pool-goldens/head/queryPoolState\.json$''',
  '''^fixtures/reference/ntc-wallet-peers-11\.1\.3/peer-relays/genesis/shelley-genesis\.json$''',
  '''^fixtures/reference/plutus-forecast-horizon/conway-past-horizon/genesis/shelley-genesis\.json$''',
  '''^fixtures/reference/refusals/conway-devnet/genesis/shelley-genesis\.json$''',
  '''^fixtures/reference/wallet-queries/manifest\.json$''',
  # A public operational-certificate verification key used as an expected value: the file now, and
  # where it was before the package rename (the scan covers the whole history, so both paths stay).
  '''^node/src/test/scala/xyz/kd5ujc/scarab/node/forge/KeyFilesSuite\.scala$''',
  '''^node/src/test/scala/lab/node/forge/KeyFilesSuite\.scala$''',
  # A mainnet transaction id (public chain data) held in a constant named Key.
  '''^node/src/test/scala/xyz/kd5ujc/scarab/storage/ByronHandoverUtxoSuite\.scala$''',
]
commits = [
  # The two commits as they stand after the history rewrite of 2026-10-16 (text scrubbed, content otherwise
  # equal). Their pre-rewrite ids are no longer ancestors of main and are not listed.
  "3c0e74cb7ce8eeea25b3dc45cabbdc6a00417aac",
  "58172e52dc4054e627a18647477c6bd6953361d7",
]

# Public payload SHA-256 entries, verified against original bytes by check_test_coverage.py.
# v8.24.3 uses AND to require both this exact file and the complete JSON entry line.
# Its line target includes the preceding newline (detect/location.go); no other prefix is allowed.
# https://github.com/gitleaks/gitleaks/blob/v8.24.3/README.md#configuration
[[rules.allowlists]]
description = "fixture inventory payload path to lowercase SHA-256 entry"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/data/fixture-inventory\.json$''']
regexes = ['''^\n?[ \t]*"(?:fixtures|[a-z][a-z0-9-]*/src/test/resources)/(?:[A-Za-z0-9_+.-]+/)*[A-Za-z0-9_+.-]+"[ \t]*:[ \t]*"[0-9a-f]{64}",?[ \t]*$''']

[[rules]]
id = "cardano-text-envelope-signing-key"
description = "Cardano TextEnvelope signing key"
# A cardano-cli style envelope: a JSON object whose "type" names a SigningKey and whose "cborHex" carries
# the key bytes (payment, stake, pool, KES and VRF keys alike). Verification keys use other type names.
regex = '''"type"\s*:\s*"[^"{}]*SigningKey[^"{}]*"[^{}]*?"cborHex"\s*:\s*"([0-9a-fA-F]{64,})"'''
secretGroup = 1
keywords = ["signingkey"]

[[rules]]
id = "cardano-signing-key-file"
description = "Cardano signing key file by name"
path = '''(?i)\.skey$'''
