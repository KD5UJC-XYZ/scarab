# SPDX-License-Identifier: Apache-2.0
# The agents push (remote write); Prometheus only scrapes itself and Loki.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Alert rules for a block producer (docs/running.md, "Pool monitoring"). No alertmanager is configured here:
# the owner wires notifications privately.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
