# SPDX-License-Identifier: Apache-2.0
# The agent on each worker (worker-a, worker-b): Grafana Alloy pushes outward to the monitoring
# server, so no port is opened on the worker. It sends
#   - the docker logs of every container named scarab-* to Loki,
#   - the host's metrics (node exporter) and the containers' (cAdvisor) to Prometheus,
#   - the /metrics of every scarab-* container that carries the label scarab.metrics.port.
# Settings come from .env next to this file (see .env.example).
#
# What this agent can reach: its process runs as root with the host's root file system mounted at /host/root and in
# the host's PID namespace, so it can read every file on the host, key files included. It also holds the Docker
# socket, and the `:ro` on that mount does not restrict the Docker API (docs/security/threat-model.md, B10). Do not
# deploy it on a block-producer host that holds signing keys unless you accept that (../README.md, "What the agent
# can reach").
name: scarab-agent

services:
  alloy:
    # pinned by digest, as the base images in docker/*.Dockerfile are: the digest is what is pulled, the tag is for
    # the reader (`docker buildx imagetools inspect <image>:<tag>` prints the digest of another version)
    image: grafana/alloy:v1.16.0@sha256:6e00cf7c5a692ff5f24844529416ed017d76fce922f8199004e73d5eca46b6b8
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      SCARAB_HOST: ${SCARAB_HOST:?set SCARAB_HOST in .env}
      PROMETHEUS_PUSH_URL: ${PROMETHEUS_PUSH_URL:?set PROMETHEUS_PUSH_URL in .env}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:?set LOKI_PUSH_URL in .env}
      UNIX_DISABLED_COLLECTORS: ${UNIX_DISABLED_COLLECTORS:-}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # read-only as a file, not as an API: see "What this agent can reach" above
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # node exporter and cAdvisor read the host through these; /host/root is every file on the host
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /:/host/root:ro
      # *.prom files of the pool's rotation driver (textfile collector); an empty directory is harmless
      - ${TEXTFILE_DIR:-./textfile}:/host/textfile:ro
      - /var/lib/docker:/var/lib/docker:ro
      # cAdvisor resolves containers through containerd (Docker's containerd image store)
      - /run/containerd:/run/containerd:ro
    # the runs are started with plain `docker run`, on Docker's default bridge; an agent on its own
    # compose network could not reach their /metrics (Docker isolates one bridge from another)
    network_mode: bridge
    pid: host
    # cAdvisor reads every container's cgroup, so the agent shares the host's cgroup namespace
    cgroup: host

volumes:
  alloy-data:
